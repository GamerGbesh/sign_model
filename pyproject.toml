[project]
name = "sign-model"
version = "0.1.0"
description = "Custom-vocabulary ASL sign recognizer with live web inference"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core CV + numerics
    "mediapipe>=0.10.18",
    "opencv-python>=4.9",
    "numpy>=1.26",
    # Model
    "torch>=2.2",
    # Training utilities
    "scikit-learn>=1.4",
    "tqdm>=4.66",
    # Visualization
    "matplotlib>=3.8",
    # Phase 2: gloss -> English (optional at runtime)
    "anthropic>=0.69",
    # Data acquisition
    "yt-dlp>=2025.1",
    # Web API
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    # Tests
    "pytest>=8.0",
    "stable-twi-tts[twi]>=0.2.1",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["asl"]

[tool.pytest.ini_options]
markers = [
    "tts: tests exercising real ONNX TTS synthesis",
]
